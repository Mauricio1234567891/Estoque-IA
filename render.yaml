services:
  - type: web
    name: estoque-ia-homologacao
    runtime: node
    region: ohio
    plan: free
    branch: codex/estoque-ia-homologacao
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MP_CHECKOUT_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-ia-homologacao-db
          property: connectionString
databases:
  - name: estoque-ia-homologacao-db
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []
